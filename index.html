<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>The Prayer Cards · Christopher Hager</title>
<meta name="description" content="The prayers, mantras and invocations Christopher Hager says, made into cards. Pick one.">
<style>
@font-face{font-family:'Instrument Serif';src:url('./fonts/InstrumentSerif-fa1a1a83.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Space Grotesk';src:url('./fonts/SpaceGrotesk-a57c9413.woff2') format('woff2');font-weight:300 700;font-style:normal;font-display:swap;}
:root{
  --night:#0B1220; --stone:#13203A; --stone-2:#1A2B4A;
  --gold:#B8893A; --gold-hi:#E2B867; --paper:#F2E8D6; --paper-dim:rgba(242,232,214,.66);
  --serif:'Instrument Serif',Georgia,serif; --head:'Space Grotesk',"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--night);color:var(--paper);}
body{min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse 80% 55% at 50% 30%, rgba(184,137,58,.14), transparent 70%),
             radial-gradient(ellipse 120% 80% at 50% 120%, rgba(26,43,74,.9), transparent 60%), var(--night);}
a{color:inherit;}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;}
.back{font:600 11px/1 var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-hi);text-decoration:none;padding:10px 14px;border:1px solid rgba(184,137,58,.55);border-radius:2px;}
.back:hover,.back:focus-visible{background:var(--gold);color:var(--night);outline:none;}
header{text-align:center;padding:6px 20px 0;}
.eyebrow{margin:0;font:600 11px/1.4 var(--head);letter-spacing:.32em;text-transform:uppercase;color:var(--gold-hi);}
h1{margin:10px 0 8px;font:400 clamp(44px,7vw,76px)/1 var(--serif);color:var(--gold-hi);}
.lead{margin:0 auto;max-width:34em;font:400 21px/1.5 var(--serif);color:var(--paper-dim);}

/* 2026-11-19, Christopher: every card face up, in his order, laid out like a reading.
   The grid follows the Prayer Room on cahager.com. */
.spread{list-style:none;margin:40px auto 0;padding:0 24px;max-width:1180px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:38px 26px;text-align:center;}
.spread li{opacity:0;transform:translateY(14px);animation:deal .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 55ms);}
@keyframes deal{to{opacity:1;transform:none}}
.spread a{display:grid;gap:10px;align-content:start;text-decoration:none;color:inherit;}
.face{display:block;width:100%;aspect-ratio:1136 / 1408;overflow:hidden;border-radius:9px;
  border:1px solid rgba(226,184,103,.55);box-shadow:0 14px 34px rgba(0,0,0,.55);
  background:radial-gradient(ellipse at 50% 40%, #1E3560, #0C1730 75%);
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;}
.face img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%;}
.face.tall img{object-fit:contain;object-position:50% 50%;}
.spread a:hover .face,.spread a:focus-visible .face{transform:translateY(-6px);border-color:rgba(226,184,103,.95);
  box-shadow:0 20px 44px rgba(0,0,0,.6),0 0 22px rgba(226,184,103,.35);}
.spread a:focus-visible{outline:none;}
.spread a:focus-visible .face{outline:2px solid var(--gold-hi);outline-offset:4px;}
.num{font:600 10px/1 var(--head);letter-spacing:.28em;color:rgba(226,184,103,.6);}
.name{font:400 22px/1.15 var(--serif);color:var(--paper);transition:color .2s;}
.spread a:hover .name,.spread a:focus-visible .name{color:var(--gold-hi);}
.by{font:600 10px/1.5 var(--head);letter-spacing:.2em;text-transform:uppercase;color:var(--paper-dim);}

.hint{margin:40px auto 0;text-align:center;padding:0 20px;font:400 19px/1.5 var(--serif);color:var(--paper-dim);}
footer{text-align:center;padding:22px 20px 34px;font:600 10px/1.6 var(--head);letter-spacing:.24em;text-transform:uppercase;color:rgba(242,232,214,.45);}

@media (max-width:480px){
  .spread{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 16px;padding:0 16px;}
  .name{font-size:19px;} .by{font-size:9px;letter-spacing:.16em;}
  h1{font-size:44px;} .lead{font-size:19px;}
}
@media (prefers-reduced-motion:reduce){ .spread li{animation:none;opacity:1;transform:none;} .face{transition:none;} }
</style>
</head>
<body>
<div class="top"><a class="back" href="https://hagerca.github.io/">&larr; The Alchemy Lab</a><span class="eyebrow">15 cards</span></div>
<header>
  <p class="eyebrow">Teachings &middot; Christopher Hager</p>
  <h1>The Prayer Cards</h1>
  <p class="lead">The prayers, mantras and invocations I say, made into cards. Pick one.</p>
</header>

<ol class="spread" id="spread" aria-label="The deck, laid out face up"></ol>

<p class="hint">Open a card to read its prayer, then walk through the deck with the arrows.</p>

<footer>CAHager.com &middot; Every card credits whoever wrote its words</footer>

<script>
const DECK = [{"slug":"yeshua-and-the-archangels","title":"Yeshua and the Archangels","by":"Invocations · Christopher Hager","tall":false},{"slug":"christ-energy-prayer","title":"The Christ Energy Prayer","by":"By Carol Channell-Cox","tall":false},{"slug":"divine-masculine-prayer-of-remembering","title":"Divine Masculine: Prayer of Remembering","by":"Christopher Hager · since June 23, 2023","tall":false},{"slug":"the-door-of-everything","title":"The Door of Everything","by":"From The Door of Everything by Ruby Nelson, 1963","tall":false},{"slug":"the-water-blessing","title":"The Water Blessing","by":"Christopher Hager · since June 9, 2024","tall":false},{"slug":"throat-chakra-clearing","title":"Throat Chakra Clearing","by":"Christopher Hager · since July 11, 2024","tall":false},{"slug":"healing-prayers","title":"Healing Prayers","by":"After Paramahansa Yogananda","tall":false},{"slug":"family-prayers","title":"Family Prayers","by":"Christopher Hager","tall":false},{"slug":"isis-and-hathor","title":"Isis & Hathor","by":"From The Sophia Code by Kaia Ra","tall":false},{"slug":"abundance-of-money","title":"Prayer for the Abundance of Wealth","by":"Christopher Hager","tall":false},{"slug":"stag-invocation","title":"Stag Invocation","by":"Christopher Hager","tall":false},{"slug":"the-prayer-of-divine-union","title":"The Prayer of Divine Union","by":"Christopher Hager","tall":false},{"slug":"opening-sacred-space","title":"Opening Sacred Space","by":"By Alberto Villoldo · The Four Winds Society","tall":false},{"slug":"prayer-of-acceptance","title":"Prayer of Acceptance","by":"Traditional · author unknown","tall":false},{"slug":"the-healing-prayer","title":"The Healing Prayer","by":"Traditional · Author unknown","tall":false}];
const spread = document.getElementById('spread');
DECK.forEach((c, i) => {
  const li = document.createElement('li');
  li.style.setProperty('--i', i);
  li.innerHTML = `<a href="./${c.slug}/"><span class="face"><img src="./${c.slug}/thumb.jpg" alt="The prayer card for ${c.title}." loading="lazy" decoding="async"></span>`
    + `<span class="num">${String(i + 1).padStart(2, '0')}</span><span class="name">${c.title}</span><span class="by">${c.by}</span></a>`;
  /* A card much taller than the rest (Remembering) shows whole rather than cropped, as on the website. */
  const img = li.querySelector('img');
  const fit = () => { if (img.naturalHeight > img.naturalWidth * 1.6) img.parentNode.classList.add('tall'); };
  img.complete ? fit() : img.addEventListener('load', fit);
  spread.appendChild(li);
});
</script>
</body>
</html>
